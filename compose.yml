services:
  autogen-studio:
    build:
      context: ./python/packages/autogen-studio
      dockerfile: Dockerfile
    
    ports:
      - "127.0.0.1:6060:8081"
      
    volumes:
      - ./autogen_data:/home/user/app
      
    # Mengikat ID pengguna host agar sama persis dengan UID 1000 di dalam container
    # Ini menyelesaikan masalah Permission Denied secara otomatis dan terstruktur
    userns_mode: "keep-id:uid=1000,gid=1000"
      
    env_file:
      - .env
      
    restart: unless-stopped
